<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calculadora Mágica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .phone {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      border-radius: 0;
      overflow: hidden;
      background: #000;
    }

    .status-bar {
      height: 44px;
      display: flex;
      justify-content: center;
      position: relative;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .iso { position: absolute; left: 16px; top: 30px; font-size: 12px; }
    .battery { position: absolute; right: 10px; top: 28px; font-size: 12px; }
    .notch { width: 120px; height: 32px; background: #000; border-radius: 20px; margin-top: 6px; }

    .result {
      flex: 1.4;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 26px 8px;
    }
    #display {
      color: #fff;
      font-size: 46px;
      font-weight: 300;
      max-width: 100%;
      overflow: hidden;
      word-break: break-all;
      text-align: right;
      line-height: 1.15;
    }
    #display.small { font-size: 34px; }
    #display.tiny { font-size: 24px; }

    .buttons {
      flex: 1;
      min-height: 0;
      padding: 0 10px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 12px;
    }

    .btn {
      height: auto;
      min-height: 0;
      border-radius: 50px;
      border: none;
      font-size: 30px;
      font-weight: 400;
      cursor: pointer;
      color: #fff;
      background: #333;
      font-family: inherit;
      transition: filter 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { filter: brightness(1.7); }

    .gray { background: #a5a5a5; color: #000; }
    .orange { background: #ff9f0a; color: #fff; }
    .zero { grid-column: span 2; justify-content: flex-start; padding-left: 30px; }
    .op-lg { font-size: 40px; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2e;
      color: #fff;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 15px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status-bar">
        <span class="iso"></span>
        <div class="notch"></div>
        <span class="battery"></span>
      </div>

      <div class="result">
        <div id="display">0</div>
      </div>

      <div class="buttons">
        <button class="btn gray" id="btnAC">AC</button>
        <button class="btn gray" id="btnSign">+&#8722;</button>
        <button class="btn gray" id="btnPct">&#37;</button>
        <button class="btn orange op-lg" id="btnDiv">&#247;</button>

        <button class="btn" data-num="7">7</button>
        <button class="btn" data-num="8">8</button>
        <button class="btn" data-num="9">9</button>
        <button class="btn orange op-lg" id="btnMul">&#215;</button>

        <button class="btn" data-num="4">4</button>
        <button class="btn" data-num="5">5</button>
        <button class="btn" data-num="6">6</button>
        <button class="btn orange op-lg" id="btnSub">&#8722;</button>

        <button class="btn" data-num="1">1</button>
        <button class="btn" data-num="2">2</button>
        <button class="btn" data-num="3">3</button>
        <button class="btn orange op-lg" id="btnAdd">+</button>

        <button class="btn zero" data-num="0">0</button>
        <button class="btn" id="btnDot">.</button>
        <button class="btn orange op-lg" id="btnEq">=</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function(){
      const display = document.getElementById('display');
      const toast = document.getElementById('toast');
      const btnAC = document.getElementById('btnAC');
      const btnSign = document.getElementById('btnSign');
      const btnPct = document.getElementById('btnPct');
      const btnDiv = document.getElementById('btnDiv');
      const btnMul = document.getElementById('btnMul');
      const btnSub = document.getElementById('btnSub');
      const btnAdd = document.getElementById('btnAdd');
      const btnEq = document.getElementById('btnEq');
      const btnDot = document.getElementById('btnDot');

      // ---- Estado visible (expresión) ----
      let expression = '0';        // todo lo que se ve en pantalla
      let tokens = [];             // p. ej. ['342','x','234','x','943','+','34594956']
      let justEqualed = false;

      // ---- Estado del truco ----
      let product = null;          // a * b * c
      let y = null;                // número que introduce el público

      function pad(n){ return n < 10 ? '0'+n : ''+n; }

      // fecha y hora de HOY como ddmmaahhmm (con +5 min para encajar el truco)
      function getStamp(){
        const now = new Date();
        const dd = pad(now.getDate());
        const mm = pad(now.getMonth()+1);
        const yy = ('000'+(now.getFullYear()%100)).slice(-2);
        const hh = pad(now.getHours());
        let min = now.getMinutes()+1;
        if(min>=60) min=59;
        return parseInt(dd+mm+yy+hh+pad(min),10);
      }

      function setDisplay(){
        display.textContent = expression;
        display.classList.toggle('small', expression.length>10);
        display.classList.toggle('tiny', expression.length>16);
      }

      function showToast(msg){
        // sin popups: el truco debe pasar desapercibido
        void msg;
      }

      function render(){
        // reconstruye la expresión desde tokens y la muestra
        expression = tokens.join('') || '0';
        setDisplay();
      }

      // Devuelve true si el último token es un número (digitos con opcional punto)
      function lastIsNumber(){
        if(!tokens.length) return false;
        return /^[\d.]+$/.test(tokens[tokens.length-1]);
      }

      // ---- teclas de número ----
      function pressDigit(d){
        if(justEqualed){ tokens=[]; justEqualed=false; }
        if(!tokens.length){ tokens.push(d); render(); return; }
        const last = tokens[tokens.length-1];
        if(/^[\d.]+$/.test(last)){
          if(last==='0'){ tokens[tokens.length-1]=d; }
          else tokens[tokens.length-1]+=d;
        } else {
          tokens.push(d);
        }
        render();
      }

      function pressDot(){
        if(justEqualed){ tokens=[]; justEqualed=false; }
        if(!tokens.length){ tokens.push('0.'); render(); return; }
        const last = tokens[tokens.length-1];
        if(/^[\d.]+$/.test(last)){
          if(last.indexOf('.')===-1) tokens[tokens.length-1]+='.';
        } else {
          tokens.push('0.');
        }
        render();
      }

      function pressOperator(op){
        if(justEqualed){ justEqualed=false; }
        if(!tokens.length){
          if(op==='-') tokens.push('-');
          render();
          return;
        }
        const last = tokens[tokens.length-1];
        if(/^[\d.]+$/.test(last)){
          tokens.push(op);
        } else {
          tokens[tokens.length-1]=op; // reemplaza operador previo
        }
        render();
      }

      // ---- captura del producto (a x b x c) desde la expresión ----
      function captureProduct(){
        if(product!==null) return true;
        // buscar secuencia num op num op num
        if(tokens.length>=5){
          const n1=parseFloat(tokens[0]), o1=tokens[1], n2=parseFloat(tokens[2]), o2=tokens[3], n3=parseFloat(tokens[4]);
          if(!isNaN(n1)&&!isNaN(n2)&&!isNaN(n3)&&o1==='x'&&o2==='x'){
            product = n1*n2*n3;
            showToast('Producto: '+n1+' x '+n2+' x '+n3+' = '+product);
            return true;
          }
        }
        showToast('Primero multiplica los 3 números (n x n x n)');
        return false;
      }

      // ---- BOTÓN % (truco) ----
      // Si hay 3 números multiplicados sin terminar, captura el producto.
      // A continuación, con la expresión ya mostrada ...+y, reemplaza y por x
      // tal que producto + y + x = getStamp()  ->  x = stamp - producto - y
      function doTrick(){
        if(!captureProduct()) return;

        // Comprobar patrón: seq(x) ... + y   (el último operador es +)
        let idxOp = -1;
        for(let i=0;i<tokens.length;i++){
          if(tokens[i]==='+') idxOp=i;
        }
        if(idxOp===-1 || idxOp===tokens.length-1){
          showToast('Toca + y deja que el público escriba un número');
          return;
        }
        const yStr = tokens[tokens.length-1];
        if(!/^\d+(\.\d+)?$/.test(yStr)){
          showToast('El público debe escribir un número después del +');
          return;
        }
        y = parseFloat(yStr);

        // x = stamp - product - y
        const stamp = getStamp();
        let x = stamp - product - y;
        while(x<0) x += stamp;

        // Reemplazar el último token (y) por el nuevo x
        if(/^\d+(\.\d+)?$/.test(String(x))){
          tokens[tokens.length-1] = String(x);
          // convertir el + previo a = visualmente (igual que muestra el resultado)
          render();
          showToast('x = '+stamp+' - '+product+' - '+y+' = '+x);
          justEqualed = true;
        }
      }

      // ---- BOTÓN = (final) ----
      function doEquals(){
        // Mostrar siempre la fecha y hora de hoy
        const stamp = getStamp();
        tokens = [String(stamp)];
        render();
        showToast('¡El resultado es la hora! '+stamp);
        justEqualed = true;
        // reset del estado para un nuevo truco
        product = null;
        y = null;
      }

      function doClear(){
        tokens = [];
        product = null;
        y = null;
        justEqualed = false;
        render();
      }

      function doSign(){
        if(!tokens.length) return;
        const last = tokens[tokens.length-1];
        if(/^\d+(\.\d+)?$/.test(last)){
          if(last.charAt(0)==='-') tokens[tokens.length-1] = last.slice(1);
          else tokens[tokens.length-1] = '-'+last;
        }
        render();
      }

      // ---- eventos ----
      document.querySelectorAll('.btn[data-num]').forEach(b=>{
        b.addEventListener('click',()=>pressDigit(b.dataset.num));
      });
      btnDot.addEventListener('click', pressDot);
      btnAdd.addEventListener('click', ()=>pressOperator('+'));
      btnSub.addEventListener('click', ()=>pressOperator('-'));
      btnMul.addEventListener('click', ()=>pressOperator('x'));
      btnDiv.addEventListener('click', ()=>pressOperator('/'));
      btnPct.addEventListener('click', doTrick);
      btnEq.addEventListener('click', doEquals);
      btnAC.addEventListener('click', doClear);
      btnSign.addEventListener('click', doSign);

      document.addEventListener('keydown',(e)=>{
        const k=e.key;
        if(/^[0-9]$/.test(k)) pressDigit(k);
        else if(k==='+') pressOperator('+');
        else if(k==='-') pressOperator('-');
        else if(k==='*') pressOperator('x');
        else if(k==='/'){ e.preventDefault(); pressOperator('/'); }
        else if(k==='%') doTrick();
        else if(k==='='||k==='Enter'){ e.preventDefault(); doEquals(); }
        else if(k==='.'||k===',') pressDot();
        else if(k==='Escape'||k==='Backspace') doClear();
      });

      // reloj barra de estado
      const iso=document.querySelector('.iso'), battery=document.querySelector('.battery');
      function clock(){
        const n=new Date();
        iso.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
      }
      clock();
      setInterval(clock,1000);
      battery.textContent='73%  \u25B3';
    })();
  </script>
</body>
</html>
